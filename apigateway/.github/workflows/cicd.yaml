name: LMS API Gateway CI/CD

on:

  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  id-token: write
  contents: read


env:

  AWS_REGION: ap-south-1

  ECR_REPOSITORY: lms-ecr

  EKS_CLUSTER_NAME: lms-ecr
  K8S_NAMESPACE: lms

  APP_NAME: apigateway


jobs:

  build-test-deploy:

    runs-on: ubuntu-latest


    steps:

      # ==========================================
      # 1. CHECKOUT CODE
      # ==========================================

      - name: Checkout source code

        uses: actions/checkout@v4


      # ==========================================
      # 2. SETUP JAVA 17
      # ==========================================

      - name: Setup Java 17

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: '17'

          cache: maven


      # ==========================================
      # 3. MAVEN TEST
      # ==========================================

      - name: Run Maven tests

        working-directory: ./apigateway

        run: |

          chmod +x mvnw

          ./mvnw clean test


      # ==========================================
      # 4. BUILD JAR
      # ==========================================

      - name: Build application

        working-directory: ./apigateway

        run: |

          ./mvnw clean package -DskipTests


      # ==========================================
      # 5. CONFIGURE AWS
      # ==========================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ==========================================
      # 6. LOGIN TO AMAZON ECR
      # ==========================================

      - name: Login to Amazon ECR

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================
      # 7. SET IMAGE VARIABLES
      # ==========================================

      - name: Set Docker image

        id: image

        run: |

          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

          IMAGE_TAG=${GITHUB_SHA}

          IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> $GITHUB_ENV

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV


      # ==========================================
      # 8. BUILD DOCKER IMAGE
      # ==========================================

      - name: Build Docker image

        working-directory: ./apigateway

        run: |

          docker build \
            -t ${{ env.IMAGE_URI }} \
            .


      # ==========================================
      # 9. PUSH IMAGE TO ECR
      # ==========================================

      - name: Push Docker image to ECR

        run: |

          docker push ${{ env.IMAGE_URI }}


      # ==========================================
      # 10. CONNECT TO EKS
      # ==========================================

      - name: Update kubeconfig

        run: |

          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}


      # ==========================================
      # 11. CREATE NAMESPACE
      # ==========================================

      - name: Create Kubernetes namespace

        run: |

          kubectl apply \
            -f ./apigateway/k8s/namespace.yaml


      # ==========================================
      # 12. APPLY CONFIGMAP
      # ==========================================

      - name: Apply ConfigMap

        run: |

          kubectl apply \
            -f ./apigateway/k8s/configmap.yaml


      # ==========================================
      # 13. UPDATE IMAGE
      # ==========================================

      - name: Update Kubernetes image

        run: |

          kubectl set image deployment/${{ env.APP_NAME }} \
            ${{ env.APP_NAME }}=${{ env.IMAGE_URI }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --record


      # ==========================================
      # 14. CREATE DEPLOYMENT IF NOT EXISTS
      # ==========================================

      - name: Apply Kubernetes deployment

        run: |

          sed "s|REPLACE_ECR_IMAGE|${{ env.IMAGE_URI }}|g" \
            ./apigateway/k8s/deployment.yaml \
            | kubectl apply -f -


      # ==========================================
      # 15. APPLY SERVICE
      # ==========================================

      - name: Apply Kubernetes service

        run: |

          kubectl apply \
            -f ./apigateway/k8s/service.yaml


      # ==========================================
      # 16. WAIT FOR DEPLOYMENT
      # ==========================================

      - name: Wait for rollout

        run: |

          kubectl rollout status \
            deployment/${{ env.APP_NAME }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s


      # ==========================================
      # 17. SHOW PODS
      # ==========================================

      - name: Verify deployment

        run: |

          kubectl get pods \
            -n ${{ env.K8S_NAMESPACE }}

          kubectl get svc \
            -n ${{ env.K8S_NAMESPACE }}

          kubectl get deployment \
            -n ${{ env.K8S_NAMESPACE }}
