name: CI-CD Pipeline - Spring Boot to EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

# No OIDC required
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: lms-ecr
  EKS_CLUSTER_NAME: lms-eks
  K8S_NAMESPACE: lms
  APP_NAME: apigateway

jobs:

  # ============================================================
  # 1. BUILD SPRING BOOT APPLICATION
  # ============================================================
  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Java 17
      # --------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # --------------------------------------------------------
      # Check Java version
      # --------------------------------------------------------
      - name: Check Java Version
        run: |
          java -version
          mvn -version

      # --------------------------------------------------------
      # Maven Validate
      # --------------------------------------------------------
      - name: Maven Validate
        run: |
          mvn validate

      # --------------------------------------------------------
      # Maven Compile
      # --------------------------------------------------------
      - name: Maven Compile
        run: |
          mvn clean compile

      # --------------------------------------------------------
      # Run Unit Tests
      # --------------------------------------------------------
      - name: Run Tests
        run: |
          mvn test

      # --------------------------------------------------------
      # Build JAR
      # --------------------------------------------------------
      - name: Build Application
        run: |
          mvn clean package -DskipTests

      # --------------------------------------------------------
      # Show generated files
      # --------------------------------------------------------
      - name: Check Build Files
        run: |
          ls -lh target/

      # --------------------------------------------------------
      # Upload JAR as artifact
      # --------------------------------------------------------
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: target/*.jar


  # ============================================================
  # 2. DOCKER BUILD + PUSH TO ECR
  # ============================================================
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Download Spring Boot JAR
      # --------------------------------------------------------
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: springboot-jar
          path: target

      # --------------------------------------------------------
      # Configure AWS using Access Key + Secret Key
      # --------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Verify AWS authentication
      # --------------------------------------------------------
      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Get AWS Account ID
      # --------------------------------------------------------
      - name: Get AWS Account ID
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> $GITHUB_ENV

      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region $AWS_REGION | \
          docker login \
            --username AWS \
            --password-stdin \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      # --------------------------------------------------------
      # Verify ECR repository
      # --------------------------------------------------------
      - name: Check ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --region $AWS_REGION

      # --------------------------------------------------------
      # Create Docker Image Tag
      # --------------------------------------------------------
      - name: Set Docker Image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

          echo "IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      # --------------------------------------------------------
      # Build Docker Image
      # --------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_URI \
            .

      # --------------------------------------------------------
      # Display Docker Images
      # --------------------------------------------------------
      - name: Check Docker Image
        run: |
          docker images

      # --------------------------------------------------------
      # Push Docker Image to ECR
      # --------------------------------------------------------
      - name: Push Docker Image to ECR
        run: |
          docker push $IMAGE_URI

      # --------------------------------------------------------
      # Also tag image as latest
      # --------------------------------------------------------
      - name: Tag Latest Image
        run: |
          docker tag \
            $IMAGE_URI \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      # --------------------------------------------------------
      # Push latest image
      # --------------------------------------------------------
      - name: Push Latest Image
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest


  # ============================================================
  # 3. DEPLOY TO EKS
  # ============================================================
  deploy:
    name: Deploy Application to EKS
    runs-on: ubuntu-latest
    needs: docker

    steps:

      # --------------------------------------------------------
      # Checkout Kubernetes manifests
      # --------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Configure AWS using Access Key + Secret Key
      # --------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Check AWS Identity
      # --------------------------------------------------------
      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Install kubectl
      # --------------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # --------------------------------------------------------
      # Configure kubeconfig for EKS
      # --------------------------------------------------------
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # --------------------------------------------------------
      # Check EKS cluster
      # --------------------------------------------------------
      - name: Check EKS Cluster
        run: |
          aws eks describe-cluster \
            --name $EKS_CLUSTER_NAME \
            --region $AWS_REGION \
            --query 'cluster.status'

      # --------------------------------------------------------
      # Check Kubernetes Nodes
      # --------------------------------------------------------
      - name: Check Kubernetes Nodes
        run: |
          kubectl get nodes

      # --------------------------------------------------------
      # Check Namespace
      # --------------------------------------------------------
      - name: Check Namespace
        run: |
          kubectl get namespace $K8S_NAMESPACE

      # --------------------------------------------------------
      # Deploy Application
      # --------------------------------------------------------
      - name: Deploy Application
        run: |
          kubectl apply \
            -f k8s/ \
            -n $K8S_NAMESPACE

      # --------------------------------------------------------
      # Check Deployment
      # --------------------------------------------------------
      - name: Check Deployment
        run: |
          kubectl get deployment \
            $APP_NAME \
            -n $K8S_NAMESPACE

      # --------------------------------------------------------
      # Check Pods
      # --------------------------------------------------------
      - name: Check Pods
        run: |
          kubectl get pods \
            -n $K8S_NAMESPACE \
            -o wide

      # --------------------------------------------------------
      # Wait for Rollout
      # --------------------------------------------------------
      - name: Wait for Deployment
        run: |
          kubectl rollout status \
            deployment/$APP_NAME \
            -n $K8S_NAMESPACE \
            --timeout=180s

      # --------------------------------------------------------
      # Final Deployment Status
      # --------------------------------------------------------
      - name: Deployment Status
        run: |
          echo "======================================"
          echo "Deployment completed successfully"
          echo "======================================"

          kubectl get deployment \
            $APP_NAME \
            -n $K8S_NAMESPACE

          kubectl get pods \
            -n $K8S_NAMESPACE
