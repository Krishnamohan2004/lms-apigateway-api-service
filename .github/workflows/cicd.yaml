```yaml
name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: lms-ecr
  EKS_CLUSTER_NAME: lms-eks
  K8S_NAMESPACE: lms
  APP_NAME: apigateway

jobs:

  # ============================================================
  # JOB 1 - BUILD SPRING BOOT APPLICATION
  # ============================================================
  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout GitHub repository
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Find pom.xml
      # ----------------------------------------------------------
      - name: Find Maven Project
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -la

          echo ""
          echo "Searching for pom.xml..."

          POM_FILE=$(find . -type f -name "pom.xml" -print -quit)

          if [ -z "$POM_FILE" ]; then
            echo "ERROR: pom.xml was not found."
            exit 1
          fi

          echo "pom.xml found at:"
          echo "$POM_FILE"

          POM_DIR=$(dirname "$POM_FILE")

          echo "Maven project directory:"
          echo "$POM_DIR"

          echo "POM_FILE=$POM_FILE" >> "$GITHUB_ENV"
          echo "POM_DIR=$POM_DIR" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Setup Java 17
      # ----------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ----------------------------------------------------------
      # Check Java and Maven
      # ----------------------------------------------------------
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # ----------------------------------------------------------
      # Maven Validate
      # ----------------------------------------------------------
      - name: Maven Validate
        working-directory: ${{ env.POM_DIR }}
        run: |
          echo "Running Maven Validate"
          echo "Working directory:"
          pwd

          echo "Files:"
          ls -la

          echo "Running:"
          echo "mvn validate"

          mvn validate

      # ----------------------------------------------------------
      # Maven Compile
      # ----------------------------------------------------------
      - name: Maven Compile
        working-directory: ${{ env.POM_DIR }}
        run: |
          mvn clean compile

      # ----------------------------------------------------------
      # Maven Test
      # ----------------------------------------------------------
      - name: Maven Test
        working-directory: ${{ env.POM_DIR }}
        run: |
          mvn test

      # ----------------------------------------------------------
      # Maven Package
      # ----------------------------------------------------------
      - name: Maven Package
        working-directory: ${{ env.POM_DIR }}
        run: |
          mvn clean package -DskipTests

      # ----------------------------------------------------------
      # Check generated JAR
      # ----------------------------------------------------------
      - name: Check Build Output
        working-directory: ${{ env.POM_DIR }}
        run: |
          echo "Build output:"
          ls -lh target/

      # ----------------------------------------------------------
      # Upload JAR
      # ----------------------------------------------------------
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: ${{ env.POM_DIR }}/target/*.jar


  # ============================================================
  # JOB 2 - DOCKER BUILD AND PUSH TO ECR
  # ============================================================
  docker:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest

    needs: build

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Find pom.xml again
      # ----------------------------------------------------------
      - name: Find Maven Project
        shell: bash
        run: |
          POM_FILE=$(find . -type f -name "pom.xml" -print -quit)

          if [ -z "$POM_FILE" ]; then
            echo "ERROR: pom.xml was not found."
            exit 1
          fi

          POM_DIR=$(dirname "$POM_FILE")

          echo "POM_FILE=$POM_FILE" >> "$GITHUB_ENV"
          echo "POM_DIR=$POM_DIR" >> "$GITHUB_ENV"

          echo "Maven directory: $POM_DIR"

      # ----------------------------------------------------------
      # Download JAR
      # ----------------------------------------------------------
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: springboot-jar
          path: ./downloaded-artifact

      # ----------------------------------------------------------
      # Copy JAR into Maven target directory
      # ----------------------------------------------------------
      - name: Prepare JAR
        shell: bash
        run: |
          mkdir -p "$POM_DIR/target"

          cp ./downloaded-artifact/*.jar "$POM_DIR/target/"

          echo "JAR files:"
          ls -lh "$POM_DIR/target/"

      # ----------------------------------------------------------
      # Configure AWS using Access Key and Secret Key
      # ----------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Verify AWS credentials
      # ----------------------------------------------------------
      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # ----------------------------------------------------------
      # Get AWS Account ID
      # ----------------------------------------------------------
      - name: Get AWS Account ID
        shell: bash
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

          echo "AWS Account ID:"
          echo "$ACCOUNT_ID"

      # ----------------------------------------------------------
      # Login to ECR
      # ----------------------------------------------------------
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "$AWS_REGION" | \
          docker login \
            --username AWS \
            --password-stdin \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      # ----------------------------------------------------------
      # Check ECR repository
      # ----------------------------------------------------------
      - name: Check ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      # ----------------------------------------------------------
      # Create Docker image URI
      # ----------------------------------------------------------
      - name: Create Image URI
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          echo "Docker Image:"
          echo "$IMAGE_URI"

      # ----------------------------------------------------------
      # Find Dockerfile
      # ----------------------------------------------------------
      - name: Find Dockerfile
        shell: bash
        run: |
          echo "Searching for Dockerfile..."

          DOCKERFILE=$(find . -type f -name "Dockerfile" -print -quit)

          if [ -z "$DOCKERFILE" ]; then
            echo "ERROR: Dockerfile was not found."
            exit 1
          fi

          echo "Dockerfile found:"
          echo "$DOCKERFILE"

          DOCKER_DIR=$(dirname "$DOCKERFILE")

          echo "DOCKER_DIR=$DOCKER_DIR" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------
      - name: Build Docker Image
        working-directory: ${{ env.DOCKER_DIR }}
        run: |
          echo "Docker build directory:"
          pwd

          echo "Files:"
          ls -la

          docker build \
            -t "$IMAGE_URI" \
            .

      # ----------------------------------------------------------
      # Push versioned image
      # ----------------------------------------------------------
      - name: Push Docker Image
        run: |
          docker push "$IMAGE_URI"

      # ----------------------------------------------------------
      # Create latest tag
      # ----------------------------------------------------------
      - name: Tag Latest Image
        run: |
          LATEST_IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"

          echo "LATEST_IMAGE=$LATEST_IMAGE" >> "$GITHUB_ENV"

          docker tag \
            "$IMAGE_URI" \
            "$LATEST_IMAGE"

      # ----------------------------------------------------------
      # Push latest image
      # ----------------------------------------------------------
      - name: Push Latest Image
        run: |
          docker push "$LATEST_IMAGE"


  # ============================================================
  # JOB 3 - DEPLOY TO EKS
  # ============================================================
  deploy:
    name: Deploy Application to EKS
    runs-on: ubuntu-latest

    needs: docker

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Configure AWS credentials
      # ----------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Check AWS identity
      # ----------------------------------------------------------
      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # ----------------------------------------------------------
      # Setup kubectl
      # ----------------------------------------------------------
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # ----------------------------------------------------------
      # Update EKS kubeconfig
      # ----------------------------------------------------------
      - name: Update EKS Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # ----------------------------------------------------------
      # Check EKS cluster
      # ----------------------------------------------------------
      - name: Check EKS Cluster
        run: |
          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "cluster.status" \
            --output text

      # ----------------------------------------------------------
      # Check Kubernetes access
      # ----------------------------------------------------------
      - name: Check Kubernetes Nodes
        run: |
          kubectl get nodes

      # ----------------------------------------------------------
      # Check namespace
      # ----------------------------------------------------------
      - name: Check Kubernetes Namespace
        run: |
          kubectl get namespace "$K8S_NAMESPACE"

      # ----------------------------------------------------------
      # Check Kubernetes files
      # ----------------------------------------------------------
      - name: Check Kubernetes Manifests
        run: |
          echo "Kubernetes files:"
          find k8s -type f -maxdepth 2 -print

      # ----------------------------------------------------------
      # Deploy application
      # ----------------------------------------------------------
      - name: Deploy Application
        run: |
          kubectl apply \
            -f k8s/ \
            -n "$K8S_NAMESPACE"

      # ----------------------------------------------------------
      # Check deployment
      # ----------------------------------------------------------
      - name: Check Deployment
        run: |
          kubectl get deployment \
            "$APP_NAME" \
            -n "$K8S_NAMESPACE"

      # ----------------------------------------------------------
      # Check pods
      # ----------------------------------------------------------
      - name: Check Pods
        run: |
          kubectl get pods \
            -n "$K8S_NAMESPACE" \
            -o wide

      # ----------------------------------------------------------
      # Check service
      # ----------------------------------------------------------
      - name: Check Service
        run: |
          kubectl get service \
            -n "$K8S_NAMESPACE"

      # ----------------------------------------------------------
      # Wait for deployment
      # ----------------------------------------------------------
      - name: Wait for Rollout
        run: |
          kubectl rollout status \
            deployment/"$APP_NAME" \
            -n "$K8S_NAMESPACE" \
            --timeout=180s

      # ----------------------------------------------------------
      # Final status
      # ----------------------------------------------------------
      - name: Final Deployment Status
        run: |
          echo "=========================================="
          echo "APPLICATION DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          kubectl get deployment \
            "$APP_NAME" \
            -n "$K8S_NAMESPACE"

          kubectl get pods \
            -n "$K8S_NAMESPACE"

          kubectl get service \
            -n "$K8S_NAMESPACE"
```
