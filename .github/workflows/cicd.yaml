name: LMS API Gateway CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  id-token: write
  contents: read


env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: lms-ecr
  EKS_CLUSTER_NAME: lms-eks
  K8S_NAMESPACE: lms
  APP_NAME: apigateway


jobs:

  build-test-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout source code

        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================

      - name: Setup Java 17

        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ==========================================
      # 3. CHECK JAVA AND MAVEN
      # ==========================================

      - name: Check Java and Maven

        run: |

          java -version

          mvn -version


      # ==========================================
      # 4. MAVEN TEST
      # ==========================================

      - name: Run Maven tests

        working-directory: ./apigateway

        run: |

          mvn clean test


      # ==========================================
      # 5. BUILD JAR
      # ==========================================

      - name: Build application

        working-directory: ./apigateway

        run: |

          mvn clean package -DskipTests


      # ==========================================
      # 6. CONFIGURE AWS
      # ==========================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}


      # ==========================================
      # 7. LOGIN TO ECR
      # ==========================================

      - name: Login to Amazon ECR

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================
      # 8. CREATE IMAGE NAME
      # ==========================================

      - name: Set Docker image

        run: |

          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

          IMAGE_TAG=${GITHUB_SHA}

          IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

          echo "Docker Image: ${IMAGE_URI}"


      # ==========================================
      # 9. BUILD DOCKER IMAGE
      # ==========================================

      - name: Build Docker image

        working-directory: ./apigateway

        run: |

          docker build \
            -t ${{ env.IMAGE_URI }} \
            .


      # ==========================================
      # 10. PUSH TO ECR
      # ==========================================

      - name: Push Docker image to ECR

        run: |

          docker push ${{ env.IMAGE_URI }}


      # ==========================================
      # 11. CONNECT TO EKS
      # ==========================================

      - name: Configure EKS

        run: |

          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}


      # ==========================================
      # 12. VERIFY EKS
      # ==========================================

      - name: Verify EKS connection

        run: |

          kubectl get nodes


      # ==========================================
      # 13. CREATE NAMESPACE
      # ==========================================

      - name: Deploy namespace

        run: |

          kubectl apply \
            -f ./apigateway/k8s/namespace.yaml


      # ==========================================
      # 14. DEPLOY CONFIGMAP
      # ==========================================

      - name: Deploy ConfigMap

        run: |

          kubectl apply \
            -f ./apigateway/k8s/configmap.yaml


      # ==========================================
      # 15. DEPLOY APPLICATION
      # ==========================================

      - name: Deploy application

        run: |

          sed "s|REPLACE_ECR_IMAGE|${{ env.IMAGE_URI }}|g" \
            ./apigateway/k8s/deployment.yaml \
            | kubectl apply -f -


      # ==========================================
      # 16. DEPLOY SERVICE
      # ==========================================

      - name: Deploy Service

        run: |

          kubectl apply \
            -f ./apigateway/k8s/service.yaml


      # ==========================================
      # 17. WAIT FOR ROLLOUT
      # ==========================================

      - name: Wait for deployment

        run: |

          kubectl rollout status \
            deployment/${{ env.APP_NAME }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s


      # ==========================================
      # 18. VERIFY PODS
      # ==========================================

      - name: Verify application

        run: |

          echo "========== PODS =========="

          kubectl get pods \
            -n ${{ env.K8S_NAMESPACE }} \
            -o wide


          echo "========== SERVICE =========="

          kubectl get svc \
            -n ${{ env.K8S_NAMESPACE }}


          echo "========== DEPLOYMENT =========="

          kubectl get deployment \
            -n ${{ env.K8S_NAMESPACE }}
