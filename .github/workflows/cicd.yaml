```yaml
name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: lms-ecr
  EKS_CLUSTER_NAME: lms-eks
  K8S_NAMESPACE: lms
  APP_NAME: apigateway

jobs:

  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Project Structure
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          echo "POM files:"
          find . -name "pom.xml" -type f

          echo "Dockerfiles:"
          find . -iname "Dockerfile" -type f

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Java
        run: |
          java -version
          mvn -version

      - name: Maven Validate
        run: mvn validate

      - name: Maven Package
        run: mvn clean package -DskipTests

      - name: Check Target
        run: |
          ls -lh target/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: target/*.jar


  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: springboot-jar
          path: target

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS Identity
        run: aws sts get-caller-identity

      - name: Get AWS Account ID
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | \
          docker login \
            --username AWS \
            --password-stdin \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Check ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      - name: Set Image URI
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          echo "IMAGE_URI=$IMAGE_URI"

      - name: Build Docker Image
        run: |
          docker build \
            --tag "$IMAGE_URI" \
            .

      - name: Push Docker Image
        run: |
          docker push "$IMAGE_URI"

      - name: Tag Latest Image
        run: |
          docker tag \
            "$IMAGE_URI" \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"

      - name: Push Latest Image
        run: |
          docker push \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"


  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: docker

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS Identity
        run: aws sts get-caller-identity

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update EKS Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Check EKS Cluster
        run: |
          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "cluster.status"

      - name: Check Kubernetes Nodes
        run: kubectl get nodes

      - name: Check Namespace
        run: kubectl get namespace "$K8S_NAMESPACE"

      - name: Deploy Application
        run: |
          kubectl apply \
            -f k8s/ \
            -n "$K8S_NAMESPACE"

      - name: Check Deployment
        run: |
          kubectl get deployment \
            "$APP_NAME" \
            -n "$K8S_NAMESPACE"

      - name: Check Pods
        run: |
          kubectl get pods \
            -n "$K8S_NAMESPACE" \
            -o wide

      - name: Wait for Deployment
        run: |
          kubectl rollout status \
            deployment/"$APP_NAME" \
            -n "$K8S_NAMESPACE" \
            --timeout=180s

      - name: Final Status
        run: |
          echo "=========================================="
          echo "APPLICATION DEPLOYMENT COMPLETED"
          echo "=========================================="

          kubectl get deployment \
            "$APP_NAME" \
            -n "$K8S_NAMESPACE"

          kubectl get pods \
            -n "$K8S_NAMESPACE"

          kubectl get service \
            -n "$K8S_NAMESPACE"
