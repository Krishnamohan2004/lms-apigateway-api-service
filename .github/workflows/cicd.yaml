```yaml
name: CI-CD Pipeline - Spring Boot to EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: lms-ecr
  EKS_CLUSTER_NAME: lms-eks
  K8S_NAMESPACE: lms
  APP_NAME: apigateway

jobs:

  # ============================================================
  # BUILD SPRING BOOT APPLICATION
  # ============================================================
  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # Check repository structure
      - name: Check Project Files
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Searching for pom.xml:"
          find . -name "pom.xml" -type f

          echo "Searching for Dockerfile:"
          find . -iname "Dockerfile" -type f

      # Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # Maven validation
      - name: Maven Validate
        run: |
          mvn validate

      # Compile
      - name: Maven Compile
        run: |
          mvn clean compile

      # Test
      - name: Run Tests
        run: |
          mvn test

      # Package
      - name: Build Application
        run: |
          mvn clean package -DskipTests

      # Check JAR
      - name: Check Build Output
        run: |
          ls -lh target/

      # Upload JAR
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: target/*.jar


  # ============================================================
  # DOCKER BUILD AND PUSH TO ECR
  # ============================================================
  docker:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # Download JAR
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: springboot-jar
          path: target

      # AWS authentication using Access Key and Secret Key
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify AWS credentials
      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # Get AWS Account ID
      - name: Get AWS Account ID
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

      # ECR Login
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region $AWS_REGION | \
          docker login \
            --username AWS \
            --password-stdin \
            $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      # Verify ECR repository
      - name: Verify ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --region $AWS_REGION

      # Create image tag
      - name: Set Docker Image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          IMAGE_URI=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

          echo "Docker Image:"
          echo "$IMAGE_URI"

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_URI \
            .

      # Push versioned image
      - name: Push Docker Image
        run: |
          docker push $IMAGE_URI

      # Tag latest
      - name: Tag Latest Image
        run: |
          docker tag \
            $IMAGE_URI \
            $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      # Push latest
      - name: Push Latest Image
        run: |
          docker push \
            $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest


  # ============================================================
  # DEPLOY TO EKS
  # ============================================================
  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest

    needs: docker

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # AWS authentication
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Check AWS authentication
      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # Install kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # Configure EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # Check EKS
      - name: Check EKS Cluster
        run: |
          aws eks describe-cluster \
            --name $EKS_CLUSTER_NAME \
            --region $AWS_REGION \
            --query "cluster.status"

      # Check Kubernetes access
      - name: Check Kubernetes Nodes
        run: |
          kubectl get nodes

      # Check namespace
      - name: Check Namespace
        run: |
          kubectl get namespace $K8S_NAMESPACE

      # Deploy Kubernetes manifests
      - name: Deploy Application
        run: |
          kubectl apply \
            -f k8s/ \
            -n $K8S_NAMESPACE

      # Check deployment
      - name: Check Deployment
        run: |
          kubectl get deployment \
            $APP_NAME \
            -n $K8S_NAMESPACE

      # Check pods
      - name: Check Pods
        run: |
          kubectl get pods \
            -n $K8S_NAMESPACE \
            -o wide

      # Wait for rollout
      - name: Wait for Deployment
        run: |
          kubectl rollout status \
            deployment/$APP_NAME \
            -n $K8S_NAMESPACE \
            --timeout=180s

      # Final status
      - name: Final Deployment Status
        run: |
          echo "=========================================="
          echo "APPLICATION DEPLOYED SUCCESSFULLY"
          echo "=========================================="

          kubectl get deployment \
            $APP_NAME \
            -n $K8S_NAMESPACE

          kubectl get pods \
            -n $K8S_NAMESPACE

          kubectl get service \
            -n $K8S_NAMESPACE
```
