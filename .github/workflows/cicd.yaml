name: LMS API Gateway CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: lms-ecr
  EKS_CLUSTER_NAME: lms-eks
  K8S_NAMESPACE: lms
  APP_NAME: apigateway

jobs:
  cicd:

    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. CHECKOUT
      # ==============================

      - name: Checkout Code
        uses: actions/checkout@v4


      # ==============================
      # 2. JAVA 17
      # ==============================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ==============================
      # 3. MAVEN TEST
      # ==============================

      - name: Maven Test
        working-directory: ./apigateway
        run: |
          mvn clean test


      # ==============================
      # 4. MAVEN BUILD
      # ==============================

      - name: Maven Build
        working-directory: ./apigateway
        run: |
          mvn clean package -DskipTests


      # ==============================
      # 5. AWS AUTHENTICATION
      # ==============================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions


      # ==============================
      # 6. VERIFY AWS
      # ==============================

      - name: Verify AWS
        run: |
          aws sts get-caller-identity


      # ==============================
      # 7. LOGIN TO ECR
      # ==============================

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ==============================
      # 8. SET IMAGE
      # ==============================

      - name: Set Docker Image
        run: |

          ECR_REGISTRY=${{ steps.ecr.outputs.registry }}

          IMAGE_TAG=${GITHUB_SHA}

          IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV


      # ==============================
      # 9. DOCKER BUILD
      # ==============================

      - name: Docker Build
        working-directory: ./apigateway
        run: |
          docker build \
            -t ${{ env.IMAGE_URI }} \
            .


      # ==============================
      # 10. PUSH TO ECR
      # ==============================

      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_URI }}


      # ==============================
      # 11. CONNECT TO EKS
      # ==============================

      - name: Configure EKS
        run: |

          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}


      # ==============================
      # 12. VERIFY EKS
      # ==============================

      - name: Verify EKS
        run: |
          kubectl get nodes


      # ==============================
      # 13. DEPLOY TO KUBERNETES
      # ==============================

      - name: Deploy Application
        run: |

          kubectl apply \
            -f ./apigateway/k8s/namespace.yaml

          kubectl apply \
            -f ./apigateway/k8s/configmap.yaml

          sed "s|REPLACE_ECR_IMAGE|${{ env.IMAGE_URI }}|g" \
            ./apigateway/k8s/deployment.yaml \
            | kubectl apply -f -

          kubectl apply \
            -f ./apigateway/k8s/service.yaml


      # ==============================
      # 14. WAIT FOR DEPLOYMENT
      # ==============================

      - name: Wait for Deployment
        run: |

          kubectl rollout status \
            deployment/${{ env.APP_NAME }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s


      # ==============================
      # 15. VERIFY
      # ==============================

      - name: Verify Deployment
        run: |

          kubectl get pods \
            -n ${{ env.K8S_NAMESPACE }}

          kubectl get svc \
            -n ${{ env.K8S_NAMESPACE }}
