
name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: lms-ecr
  EKS_CLUSTER_NAME: lms-eks
  K8S_NAMESPACE: lms
  APP_NAME: apigateway

jobs:

  # ============================================================
  # JOB 1 - BUILD SPRING BOOT APPLICATION
  # ============================================================
  build:
    name: Build Spring Boot Application
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout GitHub repository
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Find pom.xml
      # ----------------------------------------------------------
      - name: Find Maven Project
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -la

          echo ""
          echo "Searching for pom.xml..."

          POM_FILE=$(find . -type f -name "pom.xml" -print -quit)

          if [ -z "$POM_FILE" ]; then
            echo "ERROR: pom.xml was not found."
            exit 1
          fi

          echo "pom.xml found at:"
          echo "$POM_FILE"

          POM_DIR=$(dirname "$POM_FILE")

          echo "Maven project directory:"
          echo "$POM_DIR"

          echo "POM_FILE=$POM_FILE" >> "$GITHUB_ENV"
          echo "POM_DIR=$POM_DIR" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Setup Java 17
      # ----------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ----------------------------------------------------------
      # Check Java and Maven
      # ----------------------------------------------------------
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # ----------------------------------------------------------
      # Maven Validate
      # ----------------------------------------------------------
      - name: Maven Validate
        working-directory: ${{ env.POM_DIR }}
        run: |
          echo "Running Maven Validate"
          echo "Working directory:"
          pwd

          echo "Files:"
          ls -la

          echo "Running:"
          echo "mvn validate"

          mvn validate

      # ----------------------------------------------------------
      # Maven Compile
      # ----------------------------------------------------------
      - name: Maven Compile
        working-directory: ${{ env.POM_DIR }}
        run: |
          mvn clean compile

      # ----------------------------------------------------------
      # Maven Test
      # ----------------------------------------------------------
      - name: Maven Test
        working-directory: ${{ env.POM_DIR }}
        run: |
          mvn test

      # ----------------------------------------------------------
      # Maven Package
      # ----------------------------------------------------------
      - name: Maven Package
        working-directory: ${{ env.POM_DIR }}
        run: |
          mvn clean package -DskipTests

      # ----------------------------------------------------------
      # Check generated JAR
      # ----------------------------------------------------------
      - name: Check Build Output
        working-directory: ${{ env.POM_DIR }}
        run: |
          echo "Build output:"
          ls -lh target/

      # ----------------------------------------------------------
      # Upload JAR
      # ----------------------------------------------------------
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: ${{ env.POM_DIR }}/target/*.jar


  # ============================================================
  # JOB 2 - DOCKER BUILD AND PUSH TO ECR
  # ============================================================
  # JOB 2 - DOCKER BUILD AND PUSH TO ECR
  # ============================================================
  docker:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest

    needs: build

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Find Maven project
      # ----------------------------------------------------------
      - name: Find Maven Project
        shell: bash
        run: |
          echo "Searching for pom.xml..."

          POM_FILE=$(find . -type f -name "pom.xml" -print -quit)

          if [ -z "$POM_FILE" ]; then
            echo "ERROR: pom.xml was not found"
            exit 1
          fi

          POM_DIR=$(dirname "$POM_FILE")

          echo "POM_FILE=$POM_FILE"
          echo "POM_DIR=$POM_DIR"

          echo "POM_FILE=$POM_FILE" >> "$GITHUB_ENV"
          echo "POM_DIR=$POM_DIR" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Download JAR artifact
      # ----------------------------------------------------------
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: springboot-jar
          path: downloaded-artifact

      # ----------------------------------------------------------
      # Prepare target directory
      # ----------------------------------------------------------
      - name: Prepare JAR
        shell: bash
        run: |
          echo "Downloaded files:"
          find downloaded-artifact -type f -print

          mkdir -p "$POM_DIR/target"

          JAR_FILE=$(find downloaded-artifact -type f -name "*.jar" -print -quit)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: JAR file was not found"
            exit 1
          fi

          cp "$JAR_FILE" "$POM_DIR/target/app.jar"

          echo ""
          echo "JAR copied to:"
          ls -lh "$POM_DIR/target/"

      # ----------------------------------------------------------
      # Check Dockerfile
      # ----------------------------------------------------------
      - name: Check Dockerfile
        shell: bash
        run: |
          echo "Searching for Dockerfile..."

          DOCKERFILE=$(find . -type f -name "Dockerfile" -print -quit)

          if [ -z "$DOCKERFILE" ]; then
            echo "ERROR: Dockerfile was not found"
            exit 1
          fi

          echo "Dockerfile:"
          echo "$DOCKERFILE"

          DOCKER_DIR=$(dirname "$DOCKERFILE")

          echo "DOCKER_DIR=$DOCKER_DIR" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Check build context
      # ----------------------------------------------------------
      - name: Check Docker Build Context
        shell: bash
        run: |
          echo "Maven directory:"
          echo "$POM_DIR"

          echo ""
          echo "Maven directory contents:"
          ls -la "$POM_DIR"

          echo ""
          echo "Target directory:"
          ls -lh "$POM_DIR/target"

          echo ""
          echo "Dockerfile:"
          cat "$DOCKER_DIR/Dockerfile"

      # ----------------------------------------------------------
      # Configure AWS credentials
      # ----------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Verify AWS credentials
      # ----------------------------------------------------------
      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # ----------------------------------------------------------
      # Get AWS Account ID
      # ----------------------------------------------------------
      - name: Get AWS Account ID
        shell: bash
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

          echo "AWS Account ID: $ACCOUNT_ID"

      # ----------------------------------------------------------
      # Login to Amazon ECR
      # ----------------------------------------------------------
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "$AWS_REGION" | \
          docker login \
            --username AWS \
            --password-stdin \
            "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      # ----------------------------------------------------------
      # Verify ECR repository
      # ----------------------------------------------------------
      - name: Verify ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      # ----------------------------------------------------------
      # Create image URI
      # ----------------------------------------------------------
      - name: Create Image URI
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          LATEST_IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE=$LATEST_IMAGE" >> "$GITHUB_ENV"

          echo "IMAGE_URI=$IMAGE_URI"
          echo "LATEST_IMAGE=$LATEST_IMAGE"

      # ----------------------------------------------------------
      # Build Docker image
      # ----------------------------------------------------------
      - name: Build Docker Image
        shell: bash
        run: |
          echo "Building Docker image..."

          docker build \
            -f "$DOCKER_DIR/Dockerfile" \
            -t "$IMAGE_URI" \
            "$POM_DIR"

      # ----------------------------------------------------------
      # Push versioned image
      # ----------------------------------------------------------
      - name: Push Docker Image
        run: |
          docker push "$IMAGE_URI"

      # ----------------------------------------------------------
      # Tag latest
      # ----------------------------------------------------------
      - name: Tag Latest Image
        run: |
          docker tag \
            "$IMAGE_URI" \
            "$LATEST_IMAGE"

      # ----------------------------------------------------------
      # Push latest image
      # ----------------------------------------------------------
      - name: Push Latest Image
        run: |
          docker push "$LATEST_IMAGE"

      # ----------------------------------------------------------
      # Display image
      # ----------------------------------------------------------
      - name: Docker Image Information
        run: |
          echo "=========================================="
          echo "DOCKER IMAGE PUSHED SUCCESSFULLY"
          echo "=========================================="
          echo "Versioned Image:"
          echo "$IMAGE_URI"
          echo ""
          echo "Latest Image:"
          echo "$LATEST_IMAGE"
